<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ZYX LEVEL · Bot Level Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* ═══════════════════════════════════════════════════════════
   ZYX LEVEL — iOS Dark · Purple Accent
   ═══════════════════════════════════════════════════════════ */
:root{
  /* Surfaces */
  --bg:#000;
  --bg-group:#0d0d10;
  --bg-elev:#1c1c1e;
  --bg-elev-2:#2c2c2e;

  /* Text */
  --fg:#fff;
  --fg-2:rgba(235,235,245,.85);
  --fg-3:rgba(235,235,245,.6);
  --mut:rgba(235,235,245,.5);
  --mut-2:rgba(235,235,245,.3);

  /* Separators */
  --sep:rgba(84,84,88,.45);
  --sep-strong:rgba(84,84,88,.65);

  /* Fill */
  --fill-1:rgba(120,120,128,.2);
  --fill-2:rgba(120,120,128,.16);
  --fill-3:rgba(120,120,128,.12);
  --fill-4:rgba(120,120,128,.08);

  /* PURPLE — single accent */
  --purple:#bf5af2;
  --purple-2:#9d4edd;
  --purple-soft:rgba(191,90,242,.15);
  --purple-softer:rgba(191,90,242,.08);
  --purple-glow:0 0 20px rgba(191,90,242,.35);

  /* Semantic (all purple-tinted) */
  --ok:#bf5af2;
  --warn:#bf5af2;
  --err:#e63946;
  --gold:#bf5af2;

  /* Type */
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:'SF Mono',ui-monospace,'Menlo',monospace;

  /* Motion */
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);

  /* Safe area */
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);

  /* Radii */
  --r-card:10px;
  --r-group:14px;
  --r-pill:100px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh}
body{
  background:var(--bg);
  color:var(--fg);
  font:17px/1.29412 var(--sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex;flex-direction:column;overflow:hidden;
  overscroll-behavior:none;
  letter-spacing:-.022em;
}
button,input,select,textarea{font:inherit;color:inherit;font-family:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid rgba(191,90,242,.6);outline-offset:2px;border-radius:8px}
::selection{background:var(--purple);color:#fff}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.bar{
  display:flex;align-items:center;gap:12px;
  padding:calc(8px + var(--top)) 16px 8px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:.5px solid var(--sep);
  flex-shrink:0;z-index:10;
  min-height:calc(44px + var(--top));
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#bf5af2,#7b2cbf);
  display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;
  flex-shrink:0;letter-spacing:-.5px;
  box-shadow:0 4px 12px rgba(191,90,242,.35);
}
.brand-txt{min-width:0;line-height:1.15}
.brand-name{font:600 15px var(--sans);letter-spacing:-.02em;color:var(--fg);white-space:nowrap}
.brand-sub{font:400 11px var(--sans);color:var(--mut);letter-spacing:.01em;text-transform:uppercase;margin-top:1px}
.sp{flex:1}
.pill{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--r-pill);
  font:500 11px var(--mono);color:var(--fg-2);
  background:var(--fill-3);
  white-space:nowrap;
}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 6px rgba(191,90,242,.6)}
.pill.off i{background:var(--err);box-shadow:none}
.lg{display:flex;background:var(--fill-3);border-radius:var(--r-pill);padding:2px}
.lg button{
  border:0;background:none;color:var(--fg-3);
  font:600 11px var(--sans);padding:4px 10px;border-radius:var(--r-pill);
  transition:all .25s var(--ease);letter-spacing:.02em;
}
.lg button.on{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(191,90,242,.4)}

/* ═══════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════ */
main{flex:1;min-height:0;position:relative;background:var(--bg)}
.page{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.page.on{display:block}
.page>.in{
  max-width:680px;margin:0 auto;
  padding:16px 16px calc(140px + var(--bot));
}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.page.on .in{animation:fadein .35s var(--ease) both}

/* ═══════════════════════════════════════════════════════════
   TYPOGRAPHY
   ═══════════════════════════════════════════════════════════ */
.title{
  font:700 34px/1.1 var(--sans);
  letter-spacing:-.04em;
  color:var(--fg);
  margin-bottom:2px;
}
.subtitle{font:400 15px var(--sans);color:var(--mut);letter-spacing:-.01em;margin-bottom:20px}
.section{
  font:400 13px var(--sans);
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin:28px 4px 8px;
  padding-left:0;
}
.section:first-child{margin-top:8px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ph>div{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn{
  height:34px;padding:0 14px;border-radius:var(--r-pill);
  background:var(--fill-3);
  color:var(--fg);font:600 13px var(--sans);
  display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,transform .15s;
  white-space:nowrap;
  border:0;
}
.btn i{font-size:12px}
.btn:active{transform:scale(.96);background:var(--fill-2)}
.btn.pri{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(191,90,242,.35)}
.btn.pri:active{background:var(--purple-2)}
.btn.bad{background:rgba(230,57,70,.15);color:var(--err)}
.btn.bad:active{background:rgba(230,57,70,.25)}
.btn:disabled{opacity:.4;pointer-events:none}

/* ═══════════════════════════════════════════════════════════
   HERO CARD — Purple gradient wallet
   ═══════════════════════════════════════════════════════════ */
.hero{
  border-radius:var(--r-group);
  padding:22px;
  background:linear-gradient(135deg,#7b2cbf 0%,#bf5af2 55%,#9d4edd 100%);
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(123,44,191,.4);
  margin-bottom:20px;
}
.hero:before{
  content:'';position:absolute;top:-60%;right:-30%;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  pointer-events:none;
}
.hero:after{
  content:'';position:absolute;bottom:-40%;left:-20%;
  width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  pointer-events:none;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:relative;z-index:1}
.hero-cap{
  font:500 12px var(--sans);
  text-transform:uppercase;letter-spacing:.08em;
  opacity:.75;
}
.hero-huge{
  font:700 44px/1 var(--sans);
  letter-spacing:-.05em;
  margin:8px 0 6px;
  font-feature-settings:"tnum";
  text-shadow:0 2px 12px rgba(0,0,0,.15);
}
.hero-sub{font:400 13px var(--sans);opacity:.85;letter-spacing:-.005em}

.hero-ring{width:72px;height:72px;position:relative;flex-shrink:0}
.hero-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero-ring circle{fill:none;stroke-width:5.5}
.hero-ring .t{stroke:rgba(255,255,255,.25)}
.hero-ring .f{
  stroke:#fff;stroke-linecap:round;
  transition:stroke-dasharray 1s var(--ease);
  filter:drop-shadow(0 0 6px rgba(255,255,255,.5));
}
.hero-ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font:700 15px var(--sans);letter-spacing:-.03em;
  text-shadow:0 1px 4px rgba(0,0,0,.2);
}

.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;margin-top:22px;padding-top:18px;
  border-top:.5px solid rgba(255,255,255,.22);
  position:relative;z-index:1;
}
.hero-stats>div{padding:0 12px;border-left:.5px solid rgba(255,255,255,.22)}
.hero-stats>div:first-child{border:0;padding-left:0}
.hero-stats span{display:block;font:500 11px var(--sans);opacity:.75;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.hero-stats b{font:600 18px var(--sans);letter-spacing:-.03em;font-feature-settings:"tnum"}

/* ═══════════════════════════════════════════════════════════
   STAT GRID 2x2 — RAPIH, TINGGI SAMA
   ═══════════════════════════════════════════════════════════ */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-auto-rows:1fr;
  gap:10px;
  margin-bottom:20px;
}
.stat{
  background:var(--bg-elev);
  border-radius:var(--r-card);
  padding:16px;
  position:relative;
  transition:transform .15s var(--ease);
  min-width:0;
  min-height:118px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.stat:active{transform:scale(.98)}
.stat-ic{
  width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;
  font-size:14px;color:#fff;
  background:linear-gradient(135deg,#bf5af2,#7b2cbf);
  box-shadow:0 4px 10px rgba(191,90,242,.3);
  flex-shrink:0;
  margin-bottom:auto;
}
.stat-body{
  margin-top:14px;
  min-width:0;
}
.stat-label{
  font:500 11.5px var(--sans);
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stat-val{
  font:700 28px var(--sans);
  letter-spacing:-.045em;
  font-feature-settings:"tnum";
  line-height:1;
  color:var(--fg);
}
.stat-foot{
  font:400 11.5px var(--sans);
  color:var(--mut);
  margin-top:5px;
  letter-spacing:-.005em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ═══════════════════════════════════════════════════════════
   LISTS
   ═══════════════════════════════════════════════════════════ */
.group{
  background:var(--bg-elev);
  border-radius:var(--r-group);
  overflow:hidden;
  margin-bottom:20px;
}
.row-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-bottom:.5px solid var(--sep);
  font-size:15px;
  min-height:48px;
}
.row-item:last-child{border-bottom:0}

/* ═══════════════════════════════════════════════════════════
   RANKING
   ═══════════════════════════════════════════════════════════ */
.rank-row{
  display:grid;
  grid-template-columns:28px 1fr 100px auto;
  align-items:center;gap:12px;
  padding:12px 16px;
  border-bottom:.5px solid var(--sep);
}
.rank-row:last-child{border:0}
.rank-num{
  width:24px;height:24px;border-radius:6px;
  display:grid;place-items:center;
  font:600 12px var(--mono);
  background:var(--fill-3);
  color:var(--fg-2);
}
.rank-row:nth-child(1) .rank-num{background:linear-gradient(135deg,#bf5af2,#7b2cbf);color:#fff}
.rank-row:nth-child(2) .rank-num{background:rgba(191,90,242,.35);color:#fff}
.rank-row:nth-child(3) .rank-num{background:rgba(191,90,242,.2);color:#fff}
.rank-name{font:500 15px var(--sans);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.rank-track{
  height:4px;border-radius:2px;
  background:var(--fill-3);
  overflow:hidden;
}
.rank-track u{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#bf5af2,#7b2cbf);
  border-radius:2px;
  transition:width .8s var(--ease);
}
.rank-val{font:600 13px var(--mono);color:var(--purple);font-feature-settings:"tnum";letter-spacing:-.02em}

/* ═══════════════════════════════════════════════════════════
   FEED
   ═══════════════════════════════════════════════════════════ */
.feed{padding:12px 16px}
.feed-row{
  display:flex;gap:10px;
  font:400 12.5px/1.9 var(--mono);
  color:var(--fg-3);
  white-space:nowrap;overflow:hidden;
}
.feed-row time{color:var(--mut-2);flex-shrink:0;font-feature-settings:"tnum"}
.feed-row span{overflow:hidden;text-overflow:ellipsis}
.empty{
  padding:44px 20px;text-align:center;
  color:var(--mut);font-size:14px;
}
.empty i{
  font-size:28px;opacity:.4;
  display:block;margin-bottom:10px;
  color:var(--purple);
}
.empty .btn{margin-top:14px}

/* ═══════════════════════════════════════════════════════════
   TOOLS
   ═══════════════════════════════════════════════════════════ */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.srch{
  display:flex;align-items:center;gap:8px;
  height:36px;padding:0 12px;
  background:var(--fill-3);
  border-radius:var(--r-card);
}
.srch i{color:var(--mut);font-size:14px}
.srch input{flex:1;background:none;border:0;outline:0;font-size:16px;color:var(--fg);letter-spacing:-.02em}
.srch input::placeholder{color:var(--mut-2)}
.flt{
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;padding:2px 0;
}
.flt::-webkit-scrollbar{display:none}
.flt{
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;padding:2px 0;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.flt::-webkit-scrollbar{display:none}
.flt button{
  flex-shrink:0;height:32px;padding:0 12px;
  border-radius:var(--r-pill);
  background:var(--fill-3);
  color:var(--fg-2);font:500 12.5px var(--sans);
  transition:all .15s var(--ease);
  letter-spacing:-.01em;
  scroll-snap-align:start;
  white-space:nowrap;
}
.flt button.on{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(191,90,242,.35)}
.flt button.on{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(191,90,242,.35)}

/* ═══════════════════════════════════════════════════════════
   ACCOUNT CARD
   ═══════════════════════════════════════════════════════════ */
.acct{
  border-bottom:.5px solid var(--sep);
  transition:background .15s;
}
.acct:last-child{border:0}
.acct.open{background:rgba(191,90,242,.04)}
.acct-head{
  display:grid;
  grid-template-columns:44px 1fr auto 16px;
  gap:12px;align-items:center;
  padding:12px 16px;
  cursor:pointer;
  transition:background .15s;
  user-select:none;
}
.acct-head:active{background:var(--fill-4)}
.avatar{
  width:44px;height:44px;position:relative;
  border-radius:50%;
  background:var(--fill-3);
  display:grid;place-items:center;
  overflow:hidden;
  flex-shrink:0;
}
.avatar svg{
  position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);
}
.avatar circle{fill:none;stroke-width:3}
.avatar .t{stroke:rgba(120,120,128,.25)}
.avatar .f{
  stroke:var(--purple);stroke-linecap:round;
  transition:stroke-dasharray .8s var(--ease);
}
.avatar b{
  position:relative;z-index:1;
  font:600 15px var(--sans);
  font-feature-settings:"tnum";
  letter-spacing:-.03em;
  color:var(--fg);
}
.acct.hit .avatar .f{stroke:#e0aaff}
.acct.ban .avatar .f{stroke:var(--err)}

.acct-meta{min-width:0}
.acct-name{
  font:500 16px var(--sans);
  letter-spacing:-.02em;
  color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:8px;
}
.acct-name em{
  font:600 10px var(--mono);
  font-style:normal;
  color:var(--fg-3);
  background:var(--fill-3);
  padding:2px 6px;border-radius:5px;
  letter-spacing:.05em;
  flex-shrink:0;
}
.acct-uid{
  font:400 12px var(--mono);
  color:var(--mut);
  margin-top:2px;
  letter-spacing:-.005em;
}
.status{
  display:inline-flex;align-items:center;gap:5px;
  font:500 11px var(--sans);
  padding:3px 9px;border-radius:var(--r-pill);
  letter-spacing:.01em;
  white-space:nowrap;
  background:var(--fill-3);
  color:var(--fg-2);
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.status:before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:currentColor;
  flex-shrink:0;
}
.status:before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:currentColor;
}
.status.match{color:var(--purple);background:var(--purple-soft)}
.status.online{color:#e0aaff;background:rgba(191,90,242,.12)}
.status.paused{color:var(--mut);background:var(--fill-3)}
.status.warn{color:var(--purple);background:var(--purple-soft)}
.status.ban{color:var(--err);background:rgba(230,57,70,.15)}

.chev{
  color:var(--mut-2);font-size:13px;
  transition:transform .3s var(--ease);
}
.acct.open .chev{transform:rotate(180deg)}

.acct-body{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s var(--ease);
}
.acct.open .acct-body{grid-template-rows:1fr}
.acct-body>div{overflow:hidden;min-height:0}
.acct-content{padding:0 16px 16px}

.progress-label{
  display:flex;justify-content:space-between;align-items:center;
  font:500 12px var(--sans);
  color:var(--mut);
  margin-bottom:8px;
  letter-spacing:-.005em;
}
.progress-label .pct{font:600 12px var(--mono);color:var(--fg-2);font-feature-settings:"tnum"}
.acct.ban .progress-label{color:var(--err)}
.progress-bar{
  height:6px;border-radius:3px;
  background:var(--fill-3);
  overflow:hidden;
  margin-bottom:14px;
}
.progress-bar u{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#bf5af2,#7b2cbf);
  border-radius:3px;
  transition:width .8s var(--ease);
}
.acct.hit .progress-bar u{background:linear-gradient(90deg,#e0aaff,#bf5af2)}
.acct.ban .progress-bar u{background:var(--err)}

.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--fill-4);
  border-radius:var(--r-card);
  padding:0;
  margin-bottom:14px;
  overflow:hidden;
}
.metrics>div{
  padding:12px;
  border-left:.5px solid var(--sep);
  text-align:center;
}
.metrics>div:first-child{border:0}
.metrics s{
  display:block;text-decoration:none;
  font:500 10px var(--sans);
  color:var(--mut);
  text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:4px;
}
.metrics b{
  font:600 14px var(--mono);
  font-feature-settings:"tnum";
  letter-spacing:-.03em;
  color:var(--fg);
  display:block;
}
.metrics .g b{color:var(--purple)}
.metrics b.up{animation:pulseUp 1.2s var(--ease)}
@keyframes pulseUp{0%{color:#e0aaff;transform:scale(1.08)}100%{color:var(--purple);transform:scale(1)}}

.actions{
  display:flex;gap:6px;flex-wrap:wrap;
  align-items:center;
}
.actions .time{
  margin-right:auto;
  font:500 12px var(--mono);
  color:var(--mut);
  display:inline-flex;align-items:center;gap:6px;
  letter-spacing:-.01em;
}
.actions button{
  height:32px;padding:0 12px;
  border-radius:var(--r-pill);
  background:var(--fill-3);
  color:var(--fg-2);
  font:500 12.5px var(--sans);
  transition:background .15s,transform .15s;
  display:inline-flex;align-items:center;gap:5px;
  letter-spacing:-.005em;
}
.actions button:active{transform:scale(.94);background:var(--fill-2)}
.actions .tg.hit{background:var(--purple-soft);color:#e0aaff}
.actions .del{color:var(--err)}
.actions .del:active{background:rgba(230,57,70,.15)}

/* ═══════════════════════════════════════════════════════════
   TERMINAL
   ═══════════════════════════════════════════════════════════ */
.term{
  background:#0d0d10;
  border-radius:var(--r-group);
  padding:14px 16px;
  height:calc(100dvh - 320px);
  min-height:260px;
  overflow-y:auto;
  font:12.5px/1.7 var(--mono);
  letter-spacing:-.01em;
  -webkit-overflow-scrolling:touch;
}
.term::-webkit-scrollbar{width:6px}
.term::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:3px}
.log{
  display:flex;gap:12px;
  word-break:break-word;
  padding:1px 0;
}
.log time{
  color:var(--mut-2);
  flex-shrink:0;
  font-feature-settings:"tnum";
}
.success{color:var(--purple)}
.warning{color:#e0aaff}
.error{color:var(--err)}

/* ═══════════════════════════════════════════════════════════
   BOTTOM NAV
   ═══════════════════════════════════════════════════════════ */
.dock{
  position:fixed;
  left:0;right:0;bottom:0;
  padding:8px 16px calc(8px + var(--bot));
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:.5px solid var(--sep);
  display:flex;justify-content:space-around;
  z-index:20;
}
.dock button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 12px;
  font:500 10px var(--sans);
  color:var(--mut);
  transition:color .15s;
  letter-spacing:.01em;
  position:relative;
  min-width:60px;
}
.dock button i{font-size:22px;transition:transform .25s var(--spring)}
.dock button.on{color:var(--purple)}
.dock button.on i{transform:scale(1.08)}
.dock button:active i{transform:scale(.92)}

/* ═══════════════════════════════════════════════════════════
   DIALOG
   ═══════════════════════════════════════════════════════════ */
dialog{
  margin:auto;
  width:min(400px,calc(100% - 32px));
  border:0;padding:0;
  background:transparent;
  color:var(--fg);
}
dialog[open]{animation:pop .3s var(--spring)}
dialog::backdrop{background:rgba(0,0,0,.6);animation:fade .2s}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
@keyframes fade{from{opacity:0}}

.dialog-content{
  background:#1c1c1e;
  border-radius:14px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  max-height:88dvh;overflow-y:auto;
}
.dialog-content h2{
  font:600 19px var(--sans);
  letter-spacing:-.03em;
  margin:0 0 4px;
  color:var(--fg);
}
.dialog-content p{
  font:400 13px var(--sans);
  color:var(--mut);
  margin-bottom:18px;
  line-height:1.4;
  letter-spacing:-.005em;
}

.field{margin-bottom:12px}
.field label{
  display:block;
  font:500 12px var(--sans);
  color:var(--mut);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:6px;
  padding-left:2px;
}
.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px 14px;
  background:var(--fill-3);
  border:0;border-radius:10px;
  outline:none;
  font-size:16px;
  color:var(--fg);
  transition:background .15s,box-shadow .15s;
  letter-spacing:-.01em;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  background:var(--fill-2);
  box-shadow:0 0 0 3px rgba(191,90,242,.35);
}
.field textarea{min-height:90px;resize:vertical;font:12.5px var(--mono)}
.field select{appearance:none;cursor:pointer;background-image:none}

.dialog-actions{
  display:flex;gap:8px;margin-top:20px;
}
.dialog-actions button{
  flex:1;
  height:44px;
  border-radius:11px;
  font:600 15px var(--sans);
  letter-spacing:-.01em;
  transition:background .15s,transform .15s;
}
.dialog-actions .btn-cancel{
  background:var(--fill-3);
  color:var(--fg);
}
.dialog-actions .btn-cancel:active{background:var(--fill-2)}
.dialog-actions .btn-primary{
  background:var(--purple);
  color:#fff;
  box-shadow:0 4px 12px rgba(191,90,242,.4);
}
.dialog-actions .btn-primary:active{background:var(--purple-2);transform:scale(.98)}
.dialog-actions .btn-danger{
  background:rgba(230,57,70,.15);
  color:var(--err);
}

/* ═══════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════ */
#toasts{
  position:fixed;
  top:calc(56px + var(--top));
  left:16px;right:16px;
  display:flex;flex-direction:column;align-items:center;
  gap:8px;z-index:99;pointer-events:none;
}
.toast{
  padding:10px 18px;
  border-radius:var(--r-pill);
  background:rgba(28,28,30,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  font:500 13.5px var(--sans);
  letter-spacing:-.01em;
  animation:ti .3s var(--spring);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  max-width:100%;
  text-align:center;
  border:1px solid var(--fill-3);
}
.toast.success{color:var(--purple)}
.toast.error{color:var(--err)}
@keyframes ti{from{opacity:0;transform:translateY(-12px) scale(.92)}}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
.lowend .bar,.lowend .dock,.lowend dialog::backdrop{
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
</style>

const targets=()=>{try{return JSON.parse(localStorage.getItem(TKEY)||"{}")}catch{return{}}};

const prevGain=new Map(),prevW=new Map(),openSet=new Set(),nodeEls=new Map();

  setTimeout(()=>{e.style.transition="all .3s";e.style.opacity=0;setTimeout(()=>e.remove(),300)},2600);

function tween(id,to,pre=""){

  const from=+el.dataset.n||0;el.dataset.n=to;
  if(from===to){el.textContent=pre+fmt(to);return}
  const s=performance.now();
  (function f(x){const k=Math.min(1,(x-s)/800),e=1-Math.pow(1-k,4);
    el.textContent=pre+fmt(Math.round(from+(to-from)*e));
    if(k<1)requestAnimationFrame(f)})(s)
}
const dur=sec=>{
  sec=Math.max(0,Math.floor(+sec||0));
  const h=Math.floor(sec/3600);
  const m=Math.floor(sec%3600/60);
  const ss=sec%60;
  const p=n=>String(n).padStart(2,"0");
  if(h>0)return `${h}${t("h")} ${p(m)}m`;
  if(m>0)return `${m}m ${p(ss)}${t("s")}`;
  return `${ss}${t("s")}`;
};
const isBan=a=>!!(a.is_banned||a.banned||a.ban===true||a.status==="BANNED"||a.status==="BAN"||(a.ban_reason&&String(a.ban_reason).length));
const isPause=a=>!isBan(a)&&!!(a.is_paused||a.status==="PAUSED");
const lvOf=a=>Math.max(1,parseInt(a.level)||1);
const post=async(u,b)=>(await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined})).json();
function state(a){
  if(isBan(a))return{k:"ban",t:"Banned"};
  if(isPause(a))return{k:"paused",t:"Paused"};
  const s=a.status||"ONLINE";
  if(s==="IN_MATCH")return{k:"match",t:`Match ${a.active_matches||1}`};
  if(s==="ONLINE")return{k:"online",t:"Online"};
  if(s.startsWith("SEARCHING")){
    // Deteksi mode dari string status
    if(s.includes("LONE_WOLF")||s.includes("LONE WOLF"))return{k:"warn",t:"LW"};
    if(s.includes("BR")||s.includes("BATTLE"))return{k:"warn",t:"BR"};
    return{k:"warn",t:t("searching")};
  }
  return{k:"warn",t:s};
}
const grow=root=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
  root.querySelectorAll("u[data-to]").forEach(u=>u.style.width=u.dataset.to+"%");
  root.querySelectorAll("circle[data-to]").forEach(c=>c.style.strokeDasharray=c.dataset.to+" 100")
}));

$("nav").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="pg-"+b.dataset.p));
  if(b.dataset.p==="log"&&auto)$("term").scrollTop=1e9;
};
const flt=(id,cb)=>{$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle("on",x===b));cb(b.dataset.f)}};
flt("f-nodes",f=>{fNode=f;filterNodes()});
flt("f-log",f=>{fLog=f;renderLogs()});

function paint(){
  const d=last,total=d.total_accounts??stats.length,ban=stats.filter(isBan).length,up=Math.max(.016,(d.uptime||60)/3600);
  tween("k-exp",Number(d.total_gained_exp||0),"+");
  tween("k-nodes",total);tween("k-match",d.total_matches_started||0);tween("k-ban",ban);
  txt("k-rate",fmt(d.exp_per_hour||0));txt("k-act",d.total_active_matches||0);
  const on=stats.filter(a=>a.status==="ONLINE"||a.status==="IN_MATCH").length;
  txt("k-online",on+" online");
  txt("k-mh",t("perhr",Math.round((d.total_matches_started||0)/up)));
  txt("k-banf",t("ofTotal",total>0?(ban/total*100).toFixed(0):"0"));
  const hp=total>0?Math.round(on/total*100):0;
  txt("h-t",hp+"%");$("h-f").style.strokeDasharray=hp+" 100";
  const c={match:0,online:0,paused:0,ban:0,warn:0};
  stats.forEach(a=>c[state(a).k]++);
  txt("k-fleet",stats.length?`${c.match} match · ${c.online} online · ${c.paused} paused`:t("nonodes"));
}
async function fetchStats(){
  if(busy)return;busy=true;
  try{
    const r=await fetch("/api/stats");if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    stats=Array.isArray(d.accounts)?d.accounts:[];
    logs=Array.isArray(d.logs)?d.logs:[];
    last=d;loaded=true;
    paint();renderNodes();renderRace();renderLogs();hitCount();
    lastOk=Date.now();
    $("pill").classList.remove("off");txt("s-st","Online");
  }catch(e){
    $("pill").classList.add("off");txt("s-st","Offline");txt("s-ago","")
  }
  busy=false;
}
function hitCount(){
  const x=targets();let h=0,w=0;
  stats.forEach(a=>{const tl=+x[String(a.uid)]||0;if(tl>0){w++;if(lvOf(a)>=tl)h++}});
  tween("k-hit",h);txt("k-hitf",t("withTg",w))
}

function renderRace(){
  const box=$("race"),list=stats.filter(a=>!isBan(a)).sort((a,b)=>(b.gained_exp||0)-(a.gained_exp||0)).slice(0,8);
  if(!list.length){box.innerHTML=`<div class="empty" style="padding:24px 16px"><i class="fa-solid fa-trophy"></i>${t(loaded?"norace":"wait")}</div>`;return}
  const mx=Math.max(1,...list.map(a=>a.gained_exp||0));
  box.innerHTML=list.map((a,i)=>{
    const id="r"+a.uid,w=(a.gained_exp||0)/mx*100,o=prevW.get(id)||0;
    prevW.set(id,w);
    return`<div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-name">${esc(a.nickname||a.uid)}</div><div class="rank-track"><u style="width:${o}%" data-to="${w}"></u></div><div class="rank-val">+${fmt(a.gained_exp)}</div></div>`
  }).join("");
  grow(box);
}

function renderNodes(){
  const box=$("nodes"),allP=stats.length>0&&stats.every(a=>a.is_paused||a.status==="PAUSED");
  $("b-pause").innerHTML=`<i class="fa-solid fa-${allP?"play":"pause"}"></i>`;
  $("b-pause").title=allP?t("resumeall"):t("pauseall");
  if(!stats.length){
    box.innerHTML=loaded
      ?`<div class="empty"><i class="fa-solid fa-server"></i>${t("noact")}<br><button class="btn pri" data-act="add" style="margin-top:14px">${t("addfirst")}</button></div>`
      :`<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i>${t("connecting")}</div>`;
    nodeEls.clear();
    return
  }
  box.querySelectorAll(".empty").forEach(e=>e.remove());
  const tg=targets(),seen=new Set();
  stats.forEach(a=>{
    const uid=String(a.uid);seen.add(uid);
    const lv=lvOf(a),nx=Math.min(100,lv+1),base=EXP[lv]??0,to=EXP[nx]??base+5e4,cur=Number(a.current_exp||0);
    const pct=lv>=100?100:Math.min(100,Math.max(0,(cur-base)/Math.max(1,to-base)*100));
    const tl=+tg[uid]||0,hit=tl>0&&lv>=tl,st=state(a),ban=st.k==="ban",pz=st.k==="paused";
    let c=nodeEls.get(uid);
    if(!c){c=document.createElement("div");c.id="acc-"+uid;box.append(c);nodeEls.set(uid,c)}
    const old=+c.dataset.pct||0;
    c.className="acct"+(hit?" hit":"")+(ban?" ban":"")+(openSet.has(uid)?" open":"");
    Object.assign(c.dataset,{uid,nick:a.nickname||"",st:st.k,hit:hit?1:0,pct});
    const g=Number(a.gained_exp||0),pg=prevGain.get(uid),up=pg!==undefined&&g>pg;
    prevGain.set(uid,g);
    const tgl=tl>0?(hit?`<i class="fa-solid fa-check"></i>`:`${lv}/${tl}`):`<i class="fa-solid fa-bullseye"></i>`;
    c.innerHTML=`
      <div class="acct-head">
        <div class="avatar">
          <svg viewBox="0 0 44 44">
            <circle class="t" cx="22" cy="22" r="19" pathLength="100"/>
            <circle class="f" cx="22" cy="22" r="19" pathLength="100" style="stroke-dasharray:${old} 100" data-to="${pct}"/>
          </svg>
          <b>${lv}</b>
        </div>
        <div class="acct-meta">
          <div class="acct-name">${esc(a.nickname||"Unknown")}<em>${esc(a.region||"BD")}</em></div>
          <div class="acct-uid">${esc(uid)}</div>
        </div>
        <span class="status ${st.k}">${esc(st.t)}</span>
        <i class="chev fa-solid fa-chevron-down"></i>
      </div>
      <div class="acct-body"><div><div class="acct-content">
        <div class="progress-label">
          <span>${ban?esc(a.ban_reason||a.ban_message||t("banreason")):t("levelto",lv,nx)}</span>
          <span class="pct">${ban?"":pct.toFixed(1)+"%"}</span>
        </div>
        <div class="progress-bar"><u style="width:${old}%" data-to="${pct}"></u></div>
        <div class="metrics">
          <div><s>${t("start_l")}</s><b>${fmt(a.initial_exp)}</b></div>
          <div><s>${t("cur_l")}</s><b>${fmt(cur)}</b></div>
          <div class="g"><s>${t("har_l")}</s><b class="${up?"up":""}">+${fmt(g)}</b></div>
        </div>
        <div class="actions">
          <span class="time" data-up="${Math.floor(a.uptime_seconds||0)}" data-pz="${pz||ban?1:0}"><i class="fa-solid fa-stopwatch"></i>${dur(a.uptime_seconds)}</span>
          <button class="tg ${hit?"hit":""}" data-act="target">${tgl}</button>
          ${ban?"":`<button data-act="pause"><i class="fa-solid fa-${pz?"play":"pause"}"></i></button><button data-act="restart"><i class="fa-solid fa-rotate-right"></i></button><button data-act="sync"><i class="fa-solid fa-arrows-rotate"></i></button>`}
          <button class="del" data-act="del"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div></div></div>`;
  });
  nodeEls.forEach((el,uid)=>{if(!seen.has(uid)){el.remove();nodeEls.delete(uid)}});
  grow(box);filterNodes();
}

function filterNodes(){
  const q=$("q").value.toLowerCase().trim();
  nodeEls.forEach(c=>{
    const s=c.dataset.st;
    let ok=!q||(c.dataset.uid||"").toLowerCase().includes(q)||(c.dataset.nick||"").toLowerCase().includes(q);
    if(fNode==="match")ok=ok&&s==="match";
    else if(fNode==="online")ok=ok&&(s==="online"||s==="match");
    else if(fNode==="paused")ok=ok&&s==="paused";
    else if(fNode==="hit")ok=ok&&c.dataset.hit==="1";
    else if(fNode==="ban")ok=ok&&s==="ban";
    c.style.display=ok?"":"none"
  });
}
$("q").oninput=filterNodes;

$("nodes").onclick=async e=>{
  const b=e.target.closest("[data-act]"),it=e.target.closest(".acct");
  if(b&&b.dataset.act==="add")return $("d-add").showModal();
  if(!it)return;const uid=it.dataset.uid;
  if(!b){if(e.target.closest(".acct-head")){it.classList.toggle("open");it.classList.contains("open")?openSet.add(uid):openSet.delete(uid)}return}
  try{
    const act=b.dataset.act;
    if(act==="target"){$("t-uid").value=uid;$("t-lv").value=targets()[uid]||"";$("d-target").showModal()}
    else if(act==="pause"){const d=await post("/api/account/pause",{uid});
      if(d.status==="ok"){toast(t(d.is_paused?"t_paused":"t_resumed",uid),d.is_paused?"info":"success");fetchStats()}
      else toast(d.error||t("t_fail"),"error")}
    else if(act==="restart"){toast(t("t_restart",uid));await post("/api/account/restart",{uid});setTimeout(fetchStats,800)}
    else if(act==="sync"){toast(t("t_sync",uid));await post("/api/account/refresh",{uid});setTimeout(fetchStats,800)}
    else if(act==="del"){
      if(!confirm(t("c_del",uid)))return;
      const a=stats.find(x=>String(x.uid)===uid),d=await post("/api/account/delete",{uid,auth_uid:a?.auth_uid||""});
      if(d.status==="ok"){setTarget(uid,0);openSet.delete(uid);toast(t("t_deleted",uid),"success");it.remove();nodeEls.delete(uid);fetchStats()}
      else toast(d.error||t("t_delfail"),"error")}
  }catch{toast(t("t_conn"),"error")}
};
$("b-pause").onclick=async()=>{
  try{const d=await post("/api/account/pause_all");
    if(d.status==="ok"){toast(t(d.all_paused?"t_allp":"t_allr"),d.all_paused?"info":"success");fetchStats()}
    else toast(d.error||t("t_gen"),"error")}catch{toast(t("t_conn"),"error")}
};

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
$("b-add").onclick=()=>$("d-add").showModal();
$("a-type").onchange=()=>{const g=$("a-type").value==="guest";$("a-guest").hidden=!g;$("a-token").hidden=g};
$("f-add").onsubmit=async e=>{
  e.preventDefault();let p;
  if($("a-type").value==="guest"){
    const uid=$("a-uid").value.trim(),pw=$("a-pw").value.trim();
    if(!uid||!pw)return toast(t("t_need"),"error");
    p={uid,password:pw}
  }else{
    const token=$("a-tk").value.trim();
    if(!token)return toast(t("t_needtk"),"error");
    p={token}
  }
  try{const d=await post("/api/account/add",p);
    if(d.status==="ok"){$("d-add").close();$("f-add").reset();toast(t("t_ok"),"success");fetchStats()}
    else toast(d.error||t("t_startfail"),"error")}catch{toast(t("t_conn"),"error")}
};
$("f-target").onsubmit=e=>{
  e.preventDefault();
  const uid=$("t-uid").value,lv=parseInt($("t-lv").value,10)||0;
  if(lv<0||lv>100)return toast(t("t_lvrange"),"error");
  setTarget(uid,lv);$("d-target").close();
  toast(lv?t("t_tgset",uid,lv):t("t_tgdel",uid),lv?"success":"info");
  renderNodes();hitCount();
};
$("t-clear").onclick=()=>{setTarget($("t-uid").value,0);$("d-target").close();renderNodes();hitCount()};

$("b-import").onclick=()=>$("file-import").click();
$("file-import").onchange=async function(){
  const f=this.files[0];if(!f)return;
  if(f.size>2*1024*1024){toast(t("i_big"),"error");this.value="";return}
  let j;try{j=JSON.parse(await f.text())}catch(err){toast(t("i_bad",err.message),"error");this.value="";return}
  if(!Array.isArray(j)){toast(t("i_arr"),"error");this.value="";return}
  const rows=j.filter(x=>x&&typeof x==="object"&&((typeof x.uid==="string"&&typeof x.password==="string")||typeof x.token==="string"))
    .map(x=>x.token?{token:String(x.token).trim()}:{uid:String(x.uid).trim(),password:String(x.password).trim()});
  if(!rows.length){toast(t("i_none"),"error");this.value="";return}
  if(!confirm(t("i_conf",rows.length))){this.value="";return}
  const btn=$("b-import"),prev=btn.innerHTML;btn.disabled=true;let ok=0,bad=0,err="";
  for(let i=0;i<rows.length;i++){
    btn.innerHTML=`<i class="fa-solid fa-circle-notch fa-spin"></i>`;
    try{const r=await fetch("/api/account/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rows[i])});
      const x=await r.text();let d;try{d=JSON.parse(x)}catch{d={status:r.ok?"ok":"error",error:x.slice(0,120)}}
      if(d.status==="ok"||r.ok)ok++;else{bad++;err=err||d.error}}catch(x){bad++;err=err||String(x.message||x)}
    await new Promise(r=>setTimeout(r,120));
  }
  btn.disabled=false;btn.innerHTML=prev;this.value="";
  if(ok){toast(t("i_done",ok,bad?t("i_failn",bad):""),bad?"info":"success");fetchStats()}
  else toast(t("i_total")+(err?" "+err:""),"error");
};

function renderLogs(){
  let l=logs;
  if(fLog==="match")l=l.filter(x=>String(x.message||"").toLowerCase().includes("match"));
  else if(fLog==="success")l=l.filter(x=>x.level==="success"||String(x.message||"").includes("EXP"));
  else if(fLog==="error")l=l.filter(x=>x.level==="error"||x.level==="warning");
  $("term").innerHTML=l.map(x=>`<div class="log"><time>${esc(x.time||"00:00:00")}</time><span class="${esc(x.level||"info")}">${esc(x.message||"")}</span></div>`).join("");
  if(auto)$("term").scrollTop=1e9;
  $("feed").innerHTML=logs.slice(-6).reverse().map(x=>`<div class="feed-row"><time>${esc(x.time||"")}</time><span class="${esc(x.level||"")}">${esc(x.message||"")}</span></div>`).join("")||`<div class="empty" style="padding:24px 16px">${t("noactlog")}</div>`;
}
function sty(){txt("b-scroll-t",t(auto?"asOn":"asOff"))}
$("b-scroll").onclick=()=>{auto=!auto;sty();if(auto)$("term").scrollTop=1e9};
$("term").onscroll=()=>{const x=$("term");if(auto&&x.scrollHeight-x.scrollTop-x.clientHeight>80){auto=false;sty()}};
$("b-clear").onclick=async()=>{try{await fetch("/api/logs/clear",{method:"POST"});logs=[];renderLogs();toast(t("t_logclr"),"success")}catch{toast(t("t_logfail"),"error")}};
$("sync").onclick=fetchStats;

let _lastTick=0;
function tick(now){
  if(now-_lastTick>=1000){
    _lastTick=now;
    const s=Math.floor((Date.now()-t0)/1000),p=n=>String(n).padStart(2,"0");
    txt("k-up",`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`);
    if(lastOk&&!$("pill").classList.contains("off"))txt("s-ago","· "+Math.floor((Date.now()-lastOk)/1000)+t("s"));
    nodeEls.forEach(el=>{
      if(el.dataset.pz==="1")return;
      const u=el.querySelector(".time");
      if(!u||!u.offsetParent)return;
      const v=+u.dataset.up+1;u.dataset.up=v;
      const ic=u.querySelector("i");
      if(ic)u.replaceChildren(ic,document.createTextNode(dur(v)));
    });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

applyLang();fetchStats();
function schedulePoll(){const delay=document.hidden?12000:5000;setTimeout(()=>{fetchStats().finally(schedulePoll)},delay)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fetchStats()});
setTimeout(schedulePoll,5000);
</script>
</body>
